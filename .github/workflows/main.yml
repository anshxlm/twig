name: CLI Tests

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  test-cli:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - name: Install CLI globally
        run: npm install -g .

      - name: Initialize repository
        run: |
          mkdir testrepo
          cd testrepo
          echo "My Repository" | twig init

      - name: Test commit
        run: |
          cd testrepo
          echo "hello" > file.txt
          twig commit -m "first commit"
          twig log
